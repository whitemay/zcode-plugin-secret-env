name: 建议与反馈 / Suggestion
description: 对设计或实现方案的建议 / Suggestions on design or implementation
labels: ["suggestion"]
body:
  - type: textarea
    id: idea
    attributes:
      label: 建议 / Idea
      description: 想改进什么，为什么 / What to improve and why
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 现状 workaround / Current workaround
      description: 现在是怎么凑合的（没有就写无）/ How you work around it today (or "none")
  - type: checkboxes
    id: security
    attributes:
      label: 安全确认 / Security check
      description: 请勿在 issue 中粘贴任何真实凭据、token 或 secrets.json 内容 / Do not paste real credentials, tokens, or secrets.json contents
      options:
        - label: 我确认内容不含真实凭据 / I confirm no real credentials are included
          required: true
