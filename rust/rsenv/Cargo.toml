[package]
name = "rsenv"
version = "0.4.0"
edition = "2024"

[dependencies]
turso = "0.8.3"
tokio = { version = "1", features = ["full"] }
argon2 = "0.5"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
